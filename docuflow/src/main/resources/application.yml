spring:
  application:
    name: docuflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docuflow}
    username: ${DB_USER:docuflow}
    password: ${DB_PASS:docuflow}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

docuflow:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      accessKey: ${MINIO_ACCESS_KEY:docuflow}
      secretKey: ${MINIO_SECRET_KEY:docuflow123}
      bucket: ${MINIO_BUCKET:uploads}
  rateLimit:
    capacity: 20
    refillPerSecond: 10
